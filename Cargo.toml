[package]
name = "ssologinlite"
version = "0.4.0"
edition = "2021"
authors = ["Kilian Rault"]
description = "A lightweight CLI for AWS SSO login and credential management"
homepage = "https://github.com/rowkilian/ssologinlite"
repository = "https://github.com/rowkilian/ssologinlite"
license = "MIT"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
tokio = { version = "1", features = ["full"] }
aws-sdk-sts = "1.39.0"
aws-sdk-sso = "1.39.0"
aws-sdk-ssooidc = "1.39.0"
# Pinned exactly (=) to the same SDK generation as the crates above: the AWS SDK
# raised its MSRV to 1.78 on the 2024-08-28 release, and this crate targets
# rust-version 1.77.2. A caret range would let `cargo update` drift past that.
aws-sdk-ecr = "=1.39.0"
aws-sdk-codeartifact = "=1.39.0"
aws-sdk-redshift = "=1.39.0"
aws-types = "1.3.3"
aws-smithy-types = "1.2.2"
aws-config = "1.5.5"
aws-smithy-types-convert = { version = "0.60.2", features = ["convert-chrono"] }

serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
log = "0.4.22"
log4rs = "1.3.0"
anyhow = "1.0.86"
chrono = "0.4.38"

time = "0.3.36"
glob = "0.3.1"
pickledb = "0.5.1"
clap = { version = "4.5.16", features = ["derive"] }
rust-ini = "0.21.1"
home = "0.5.9"
webbrowser = "1.0.1"
rand = "0.8.5"
sha1_smol = "1.0.1"
whoami = "1.5.2"
config = "0.14.0"
hmac = "0.12.1"
sha2 = "0.10.8"
url-search-params = "12.0.0"
base64 = "0.22.1"
ratatui = "0.29"
crossterm = "0.28"
toml = "0.8"
# Advisory file locking to serialize concurrent credential_process invocations
# against the shared credential cache. MSRV well under 1.77.2.
fs2 = "0.4"

[dev-dependencies]
proptest = "1.4"
tempfile = "3"
serial_test = "3"

[profile.release]
strip = 'symbols'
lto = true
codegen-units = 1
panic = 'abort'
opt-level = 'z'

# Windows cross-compilation toolchain lives in .cargo/config.toml — cargo ignores
# [target.*] linker/ar keys when they are placed in Cargo.toml.
